{% extends "base.html" %}

{% block title %}{{ category }} Mentors | MentorConnect{% endblock %}

{% block content %}
<main class="page-section">
  <div class="section-heading">
    <p class="eyebrow">{{ branch_name }}</p>
    <h1>{{ category }} Mentors</h1>
    <p>Showing mentors for {{ student_name }}. Data is loaded from the Flask backend.</p>
  </div>

  <div
    id="mentor-data"
    data-branch="{{ branch }}"
    data-category="{{ category }}"
  ></div>

  <section id="mentor-list" class="mentor-grid">
    <div class="loading-card">Loading mentors...</div>
  </section>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
