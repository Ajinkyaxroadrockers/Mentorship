{% extends "base.html" %}

{% block title %}Student Form | MentorConnect{% endblock %}

{% block content %}
<main class="page-section narrow-page">
  <div class="section-heading">
    <p class="eyebrow">Student Details</p>
    <h1>Tell us your branch</h1>
    <p>Enter your name and branch so we can show suitable mentorship categories.</p>
  </div>

  <form class="student-form" action="{{ url_for('submit_student') }}" method="POST">
    {% if error %}
      <p class="error-message">{{ error }}</p>
    {% endif %}

    <label for="student_name">Student Name</label>
    <input type="text" id="student_name" name="student_name" placeholder="Enter your full name" required>

    <label for="branch">Select Branch</label>
    <select id="branch" name="branch" required>
      <option value="">Choose your branch</option>
      {% for code, branch_name in branches.items() %}
        <option value="{{ code }}">{{ code }} - {{ branch_name }}</option>
      {% endfor %}
    </select>

    <button class="primary-btn full-btn" type="submit">Continue</button>
  </form>
</main>
{% endblock %}
